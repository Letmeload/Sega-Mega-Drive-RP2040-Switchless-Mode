name: Build RP2040 UF2 Firmware

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Ermöglicht manuelles Starten über die GitHub Website

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: ARM Compiler & Build-Tools installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential cmake ninja-build

      - name: Raspberry Pi Pico SDK herunterladen
        run: |
          git clone --recurse-submodules https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
          echo "PICO_SDK_PATH=$HOME/pico-sdk" >> $GITHUB_ENV

      - name: Projekt kompilieren
        run: |
          mkdir build
          cd build
          cmake -G Ninja ..
          ninja

      - name: UF2 Datei als Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: RP2040-Firmware
          path: build/*.uf2